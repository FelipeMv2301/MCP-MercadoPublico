[project]
name = "mcp-mercadopublico"
version = "0.1.0"
description = "MCP de inteligencia competitiva sobre Mercado Público de Chile — Bioquimica.cl"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pyarrow>=17",
    "pandas>=2.2",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mcp-mercadopublico = "mcp_mercadopublico.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
