# Derivado del spike del 2026-08-05: perfilado de la watchlist contra
# oc-da/2026-6 (437.538 líneas) + consulta al MCP de catálogo de Bioquímica.
# Ver docs/esquema-datos-abiertos.md y docs/alcance-y-competencia.md
#-----------------------------------------------------------------------------

[nosotros]
# ✅ RESUELTO 2026-08-05. RUT entregado por el usuario, DV validado (mod-11 = 6).
# CodigoProveedor y razón social derivados de oc-da/2026-6 sin gastar cuota de API.
