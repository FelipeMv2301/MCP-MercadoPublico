codigo_proveedor = "1202804"
razon_social_mp = "BIOQUIMICA.CL.S.A."
giro_mp = "FABRICACION DE PRODUCTOS FARMACEUTICOS, SUSTANCIAS QUIMICAS MEDICINALES"

# --- Escala real, medida en oc-da/2026-6 -------------------------------------
# 174 líneas de OC, $44.991.872 CLP neto en el mes.
# Comparación que ordena el proyecto: Arquimed facturó $4.218.769.540 el mismo
# mes — 94x más. Arquimed NO es competencia comparable. Ver [competencia.liga_a].

# --- Compradores reales (2026-06) --------------------------------------------
# Municipios y educación, NO hospitales:
#   CORP MUNICIPAL DE DESARROLLO SOCIAL DE LAMPA (49 líneas)
#   SERVICIO LOCAL DE EDUCACIÓN PÚBLICA DEL ELQUI (20)
#   UNIVERSIDAD DE TALCA (17) · I MUNICIPALIDAD DE QUILLON (11)
#   UNIVERSIDAD DE ANTOFAGASTA (10) · UNIVERSIDAD DE CHILE (9)

# --- Productos más vendidos --------------------------------------------------
#   Reactivos o soluciones químicos (20) · Materiales educativos sobre ciencia (11)
#   Alcoholes o sus sustitutos (10) · Unidades de laboratorio (9)
#   Accesorios de analizadores químicos (7) · Electroforesis (6)
#   imanes Alnico (6) · Barómetros (5)

# --- 🎯 MEZCLA DE CANAL — el hallazgo que reordena las prioridades -----------
# Del monto de OC de 2026-06:
#   76,4 %  ProcedenciaOC = "NA"  (compra ágil / trato directo)   $34.389.921
#   19,5 %  Proveniente de licitación pública                      $8.766.551
#    4,1 %  Proveniente de licitación privada                      $1.835.400
#
# El negocio entra por COMPRA ÁGIL, no por licitación. El dataset COT pasa a ser
# la fuente primaria, por delante de lic-da.
