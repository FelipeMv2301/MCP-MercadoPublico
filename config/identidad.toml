compra_agil_o_trato_directo = 34389921
licitacion_publica = 8766551
licitacion_privada = 1835400

# --- Tasa de éxito medida (COT1 2026-06) -------------------------------------
# 26 cotizaciones distintas · 40 líneas ganadas · 96 perdidas → 29,4 % de éxito.
# Las 96 líneas perdidas son la oportunidad cuantificada del proyecto.
[nosotros.win_rate_compra_agil_2026_06]
lineas_ganadas = 40
lineas_perdidas = 96
tasa = 0.294
cotizaciones_distintas = 26


#-----------------------------------------------------------------------------
# ALCANCE DE INGESTA
#-----------------------------------------------------------------------------
[ingesta]
# Decisión del usuario (2026-08-05): historia 2025-2026.
periodo_desde = "2025-1"
periodo_hasta = "2026-8"
datasets = ["oc", "lic", "cot"]

# El filtro de ingesta es por RUBRO, no por RUT.
#
# Motivo medido: la watchlist de 33 RUT captura sólo el 16,3 % del monto de los
# rubros de laboratorio en 2026-06. Filtrar la ingesta por esos RUT haría
# imposible calcular distribuciones de precio (falta el resto de los oferentes),
# detectar entrantes nuevos (por definición no están en una lista previa) y
# saber quién ganó cuando el ganador está fuera de la lista.
#
# La watchlist [competencia] es una lista de PRIORIDAD, no un filtro de datos.
filtro = "rubro_n1"


[[ingesta.rubros_n1]]
nombre = "Equipamiento para laboratorios"
motivo = "Núcleo del catálogo: vidrio, buretas, equipos e insumos de laboratorio"
subrubros_clave = [
  "Instrumentos de medida y experimentación",
  "Equipos e insumos para laboratorio",
  "Suministros para laboratorios",
]

[[ingesta.rubros_n1]]
nombre = "Productos químicos industriales"
motivo = "Línea de reactivos del catálogo (SKU RP*): ácidos, sales, solventes"
subrubros_clave = ["Compuestos y mezclas", "Solventes", "Colorantes", "Aditivos", "Metales y gases"]

[[ingesta.rubros_n1]]
# ⚠️ NOMBRE CORREGIDO 2026-08-05 al construir el ETL (HU-2.4): el valor real de
# RubroN1 en oc-da/2026-6 es "...artesanías y materiales educativos" completo,
# no "...artesanía" a secas como se había escrito de memoria. Verificado con
# DuckDB contra el CSV real (437.538 filas) antes de fijar el filtro: con el
# nombre viejo, un filtro por igualdad estricta habría descartado ESTE rubro
# completo en silencio — el de material didáctico, el más importante.
nombre = "Instrumentos musicales, juegos, juguetes, artesanías y materiales educativos"
motivo = """
⚠️ CONTRAINTUITIVO PERO CRÍTICO. Aquí está clasificado el material didáctico de
ciencias — la línea MD*/EK*/RV* del catálogo (kits escolares, modelos
anatómicos, diapasones, circuitos). El subrubro 'Materiales, artículos y
suministros didácticos' movió $1.417 M en 3.386 líneas en un solo mes.
Un filtro definido por intuición ('rubros médicos y de laboratorio') habría
perdido esta línea de negocio completa."""
subrubros_clave = [
  "Materiales, artículos y suministros didácticos",
  "Equipos de arte y manualidades, accesorios y suministros",
  "Juguetes y juegos",
]

[[ingesta.rubros_n1]]
nombre = "Muebles y mobiliario"
motivo = "Mesones de laboratorio del catálogo (SKU IL*MES). Ojo: los compradores a veces los clasifican en 'Estructuras prefabricadas'"
subrubros_clave = [
  "Mobiliario y accesorios institucional, educativo",
  "Muebles comerciales e industriales",
]

[[ingesta.rubros_n1]]
# ⚠️ NOMBRE CORREGIDO 2026-08-05 (mismo motivo que el rubro anterior): el valor
# real es "...estructuras, obras y construcciones" completo.
nombre = "Artículos para estructuras, obras y construcciones"
motivo = "Confirmado con datos propios: Bioquímica vendió 9 líneas aquí en 2026-06 ('Unidades de laboratorio' del catálogo). Varios competidores también aparecen clasificados en este rubro"
subrubros_clave = ["Estructuras prefabricadas"]

[[ingesta.rubros_n1]]
nombre = "Educación, formación, entrenamiento y capacitación"
motivo = "'Sistemas educativos complementarios' ($2.469 M/mes) puede incluir kits educativos empaquetados. VERIFICAR: el top de proveedores son OTEC y universidades vendiendo servicios, no material — quizá descartable"
subrubros_clave = ["Sistemas educativos complementarios"]
estado = "a_verificar"

[[ingesta.rubros_n1]]
nombre = "Servicios de producción y fabricación industrial"
motivo = "'Industrias de plásticos y productos químicos' — posible solape con reactivos y plásticos de laboratorio"
subrubros_clave = ["Industrias de plásticos y productos químicos"]
estado = "a_verificar"


